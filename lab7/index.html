<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat</title>
</head>
<body>
    <h1>WebSocket Chat</h1>
    <div id="chatbox"></div>
    <input id="username" type="text" placeholder="Имя пользователя">
    <input id="message" type="text" placeholder="Сообщение">
    <button onclick="sendMessage()">Отправить</button>

    <script>
        const socket = new WebSocket("ws://localhost:5252/ws");

        socket.onmessage = function(event) {
            const chatbox = document.getElementById("chatbox");
            const msg = JSON.parse(event.data);
            chatbox.innerHTML += `<p><strong>${msg.username}:</strong> ${msg.message}</p>`;
        };

        function sendMessage() {
            const username = document.getElementById("username").value;
            const message = document.getElementById("message").value;
            socket.send(JSON.stringify({
                username: username,
                message: message
            }));
        }
    </script>
</body>
</html>
